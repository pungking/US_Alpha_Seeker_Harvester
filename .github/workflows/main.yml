name: US Stock Data Master Sync

on:
  schedule:
    # 1차 실행: 한국 시간 오전 7:00 (UTC 22:00) - 매핑 갱신 및 A-M 종목 수집
    - cron: '0 22 * * *'
    # 2차 실행: 한국 시간 오전 10:00 (UTC 01:00) - N-Z 및 기타 종목 수집
    - cron: '0 1 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests google-api-python-client google-auth urllib3

      - name: Run Master Harvester
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        # GitHub 환경 시간(UTC)에 따라 파이썬 코드 내에서 그룹을 자동 판단하여 실행
        run: python harvester.py
