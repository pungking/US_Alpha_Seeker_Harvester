name: Master Stock Harvester

on:
  # 웹앱에서 신호를 주면 즉시 실행
  repository_dispatch:
    types: [stage3_completed]
    
  # 정기 스케줄
  schedule:
    - cron: '0 22 * * 1-5'
    - cron: '0 1 * * 2-6'
    
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install google-api-python-client google-auth requests yfinance pandas
        
      - name: Run Master Harvester
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 🎯 [필수 추가] 파이썬 코드가 실행 이벤트를 알 수 있도록 환경변수를 주입합니다.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python harvester.py
