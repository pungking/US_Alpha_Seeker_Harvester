name: Master Stock Harvester

on:
  # 웹앱에서 신호를 주면 즉시 실행
  repository_dispatch:
    types: [stage3_completed]
    
  # 정기 스케줄 (KST 기준 1차 07:13, 2차 12:13).
  # GitHub recommends avoiding minute 0 because scheduled delivery may be delayed.
  schedule:
    - cron: '13 22 * * 1-5'
    - cron: '13 3 * * 2-6'
    
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      batch_mode:
        description: "데일리 수집 배치 선택 (수동 실행 전용)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - first
          - second
          - all
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGE0_SEC_FINANCIAL_LINEAGE_RUN: ${{ github.event_name == 'schedule' && github.event.schedule == '13 3 * * 2-6' && vars.STAGE0_SEC_FINANCIAL_LINEAGE_PRODUCER_ENABLED == 'true' }}

concurrency:
  group: master-stock-harvester-${{ github.ref }}
  # Stage3 handoff is time-sensitive for Stage4 readiness; let it preempt
  # stale daily/manual collection runs instead of competing for Drive/API quota.
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install --upgrade google-api-python-client google-auth requests yfinance pandas

      - name: Symbol-agnostic runtime guard
        run: python scripts/check_symbol_agnostic_runtime.py
      - name: Harvester schedule-slot contract
        run: python scripts/check_harvester_schedule_slot_contract.py
      - name: Telegram routing policy audit
        run: python scripts/check_telegram_routing_policy.py
      - name: Target lineage contract
        run: python scripts/check_target_lineage_contract.py
      - name: Listing lifecycle and partial retry contract
        run: python scripts/check_listing_lifecycle_contract.py
      - name: Corporate-action lineage contract
        run: python scripts/check_corporate_action_lineage_contract.py
      - name: Earnings event coverage contract
        run: python scripts/check_earnings_event_coverage_contract.py
      - name: SEC and FINRA SHADOW_ONLY capability contract
        run: python scripts/check_sec_finra_shadow_capability.py
      - name: SEC and FINRA SHADOW_ONLY evidence producer
        run: python scripts/check_sec_finra_shadow_evidence.py
      - name: Stage0 SEC financial publication lineage producer
        run: python scripts/check_stage0_financial_publication_lineage_producer.py
      - name: Macro event clock SHADOW_ONLY capability contract
        run: python scripts/check_macro_event_clock_capability.py
      - name: Macro event clock blocker-only reproof contract
        run: python scripts/check_macro_event_clock_blocker_reproof.py
      - name: BLS registered data API capability contract
        run: python scripts/check_bls_registered_data_capability.py
      - name: Official SHADOW producer readiness contract
        run: python scripts/check_official_shadow_producer_readiness.py
      - name: Toss read-only capability contract
        run: python scripts/check_toss_read_only_capability.py
      - name: Toss Phase2a shadow market-data contract
        run: python scripts/check_toss_shadow_market_data.py
      - name: Toss same-Stage3 handoff contract
        run: python scripts/check_toss_same_stage3_handoff.py
        
      - name: Run Master Harvester
        env:
          # 🎯 [본계정 모드 전용 키로 교체]
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          # Earnings event map vendor lineage. Missing keys degrade to yfinance-only coverage.
          FMP_KEY: ${{ secrets.FMP_KEY || secrets.FMP_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || secrets.FINNHUB_API_KEY }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # The current account is free-tier; Premium activation requires a reviewed contract change.
          FINNHUB_SYMBOL_CHANGE_PREMIUM_ENABLED: 'false'
          FMP_DELISTED_PREMIUM_ENABLED: 'false'
          # Phase1 proof is complete; GitHub-hosted runners make zero Toss requests.
          TOSS_READ_ONLY_CAPABILITY_PROBE_ENABLED: 'false'
          # GitHub-hosted egress is not registered with Toss. Phase2a remains Mac-only.
          TOSS_SHADOW_PROVIDER_ENABLED: 'false'
          TOSS_SHADOW_REGISTERED_EGRESS_CONFIRMED: 'false'
          TOSS_SHADOW_MAX_PRICE_REQUESTS: '2'
          # Static producer is merged separately from recurring source activation.
          SEC_FINRA_SHADOW_PROVIDER_ENABLED: 'false'
          MACRO_EVENT_CLOCK_SHADOW_PROVIDER_ENABLED: 'false'
          
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # Harvester collection notifications must go to simulation/private channel.
          TELEGRAM_SIMULATION_CHAT_ID: ${{ secrets.TELEGRAM_SIMULATION_CHAT_ID || vars.TELEGRAM_SIMULATION_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || vars.TELEGRAM_ALERT_CHAT_ID || secrets.TELEGRAM_SIMULATION_CHAT_ID || vars.TELEGRAM_SIMULATION_CHAT_ID }}
          
          # 🎯 파이썬 코드가 웹앱 신호인지 스케줄 실행인지 판단하는 핵심 변수
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          DAILY_BATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_mode || github.event.schedule == '13 22 * * 1-5' && 'first' || github.event.schedule == '13 3 * * 2-6' && 'second' || 'auto' }}
          HARVESTER_RUN_SUMMARY_PATH: state/last-harvester-run.json
          HARVESTER_EARNINGS_EVENT_COVERAGE_AUDIT_PATH: state/stage4-earnings-event-coverage-audit.json
          HARVESTER_MAPPING_FRESHNESS_AUDIT_PATH: state/harvester-mapping-freshness-audit.json
          HARVESTER_MAPPING_FRESHNESS_AUDIT_MD_PATH: state/harvester-mapping-freshness-audit.md
          HARVESTER_TICKER_MAPPING_REFRESH_AUDIT_PATH: state/ticker-mapping-refresh-audit.json
          HARVESTER_TARGET_LINEAGE_RUNTIME_AUDIT_PATH: state/target-lineage-runtime-audit.json
          HARVESTER_CORPORATE_ACTION_RUNTIME_AUDIT_PATH: state/corporate-action-lineage-runtime-audit.json
          HARVESTER_TOSS_READ_ONLY_CAPABILITY_PATH: state/toss-read-only-capability.json
          HARVESTER_TOSS_SHADOW_PATH: state/toss-market-data-shadow.json
          HARVESTER_SEC_FINRA_SHADOW_PATH: state/sec-finra-shadow-evidence.json
          HARVESTER_MACRO_EVENT_CLOCK_SHADOW_PATH: state/macro-event-clock-shadow.json
          HARVESTER_OFFICIAL_SHADOW_SENTINEL_DIR: ${{ runner.temp }}/official-shadow-sentinels
        run: |
          mkdir -p state
          python harvester.py | tee state/harvester-output.log

      - name: Prepare Stage0 SEC financial lineage collection window
        id: stage0_sec_lineage_window
        if: env.STAGE0_SEC_FINANCIAL_LINEAGE_RUN == 'true'
        run: |
          collection_window="$(TZ=America/New_York date +%F)"
          collection_key="$(PYTHONPATH=scripts python -c 'from stage0_financial_publication_lineage_producer import recurring_collection_key; import sys; print(recurring_collection_key(sys.argv[1]))' "$collection_window")"
          echo "collection_window=$collection_window" >> "$GITHUB_OUTPUT"
          echo "collection_key=$collection_key" >> "$GITHUB_OUTPUT"

      - name: Restore Stage0 SEC financial lineage reservation
        id: stage0_sec_lineage_reservation
        if: env.STAGE0_SEC_FINANCIAL_LINEAGE_RUN == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/stage0-sec-financial-lineage-runtime-sentinel
          key: stage0-sec-financial-lineage-runtime-${{ steps.stage0_sec_lineage_window.outputs.collection_key }}
          lookup-only: true

      - name: Reserve scheduled Stage0 SEC financial lineage producer
        if: >-
          env.STAGE0_SEC_FINANCIAL_LINEAGE_RUN == 'true' &&
          steps.stage0_sec_lineage_reservation.outputs.cache-hit != 'true'
        env:
          COLLECTION_WINDOW: ${{ steps.stage0_sec_lineage_window.outputs.collection_window }}
        run: |
          python scripts/stage0_financial_publication_lineage_producer.py \
            --reserve-only \
            --recurring-activation \
            --collection-window "$COLLECTION_WINDOW" \
            --sentinel-dir "$RUNNER_TEMP/stage0-sec-financial-lineage-runtime-sentinel"

      - name: Persist scheduled Stage0 SEC financial lineage reservation
        if: >-
          env.STAGE0_SEC_FINANCIAL_LINEAGE_RUN == 'true' &&
          steps.stage0_sec_lineage_reservation.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/stage0-sec-financial-lineage-runtime-sentinel
          key: stage0-sec-financial-lineage-runtime-${{ steps.stage0_sec_lineage_window.outputs.collection_key }}

      - name: Run scheduled Stage0 SEC financial lineage producer
        if: >-
          env.STAGE0_SEC_FINANCIAL_LINEAGE_RUN == 'true' &&
          steps.stage0_sec_lineage_reservation.outputs.cache-hit != 'true'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          STAGE0_SEC_FINANCIAL_LINEAGE_PRODUCER_APPROVAL: AUTHORIZE STAGE0 SEC FINANCIAL LINEAGE PRODUCER RECURRING SECOND-BATCH
          COLLECTION_WINDOW: ${{ steps.stage0_sec_lineage_window.outputs.collection_window }}
        run: |
          python scripts/stage0_financial_publication_lineage_producer.py \
            --safe-output "state/stage0-sec-financial-lineage-safe.json" \
            --private-output "$RUNNER_TEMP/stage0-sec-financial-lineage-private.json" \
            --sentinel-dir "$RUNNER_TEMP/stage0-sec-financial-lineage-runtime-sentinel" \
            --raw-temp-dir "$RUNNER_TEMP/stage0-sec-financial-lineage-raw" \
            --recurring-activation \
            --collection-window "$COLLECTION_WINDOW"

      - name: Sync Harvester summary to Notion
        if: always()
        continue-on-error: ${{ vars.NOTION_HARVESTER_SYNC_REQUIRED != 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_DAILY_SNAPSHOT: ${{ vars.NOTION_DB_DAILY_SNAPSHOT }}
          NOTION_HARVESTER_SYNC_ENABLED: ${{ vars.NOTION_HARVESTER_SYNC_ENABLED }}
          NOTION_HARVESTER_SYNC_REQUIRED: ${{ vars.NOTION_HARVESTER_SYNC_REQUIRED }}
          NOTION_HARVESTER_WRITE_MODE: ${{ vars.NOTION_HARVESTER_WRITE_MODE || 'create_only' }}
          HARVESTER_RUN_SUMMARY_PATH: state/last-harvester-run.json
          GHA_JOB_STATUS: ${{ job.status }}
        run: python scripts/sync_notion_summary.py

      - name: Upload Harvester state artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: harvester-state-${{ github.run_id }}
          path: |
            state/last-harvester-run.json
            state/harvester-failure-report.json
            state/harvester-mapping-freshness-audit.json
            state/harvester-mapping-freshness-audit.md
            state/ticker-mapping-refresh-audit.json
            state/stage4-earnings-event-coverage-audit.json
            state/target-lineage-runtime-audit.json
            state/corporate-action-lineage-runtime-audit.json
            state/toss-read-only-capability.json
            state/toss-market-data-shadow.json
            state/sec-finra-shadow-evidence.json
            state/macro-event-clock-shadow.json
            state/symbol-agnostic-runtime-check.json
            state/symbol-agnostic-runtime-check.md
            state/telegram-routing-policy-audit.*
            state/harvester-output.log
          if-no-files-found: warn

         
