name: Macro Event Clock SHADOW Read-only Capability Probe

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact bounded macro capability approval phrase"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify explicit bounded approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          test "$APPROVAL" = "AUTHORIZE MACRO EVENT CLOCK SHADOW READ-ONLY CAPABILITY PROBE"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded client dependency
        run: python -m pip install requests

      - name: Verify static macro event clock contract
        run: python scripts/check_macro_event_clock_capability.py

      - name: Run bounded macro event clock probe
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/run_macro_event_clock_capability_probe.py \
            --output "$RUNNER_TEMP/macro-event-clock-capability.json" \
            --sentinel "$RUNNER_TEMP/macro-event-clock-capability-sentinel.json"

      - name: Upload safe aggregate evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macro-event-clock-capability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/macro-event-clock-capability.json
            ${{ runner.temp }}/macro-event-clock-capability-sentinel.json
          if-no-files-found: warn
