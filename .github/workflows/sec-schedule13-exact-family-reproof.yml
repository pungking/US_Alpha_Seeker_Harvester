name: SEC Schedule 13 Exact-Family Post-Fix Reproof

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Exact Schedule 13 post-fix approval phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sec-schedule13-exact-family-reproof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reproof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate approval and ref
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVAL" = "AUTHORIZE SEC SCHEDULE 13 EXACT-FAMILY POST-FIX REPROOF"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded client dependency
        run: python -m pip install requests

      - name: Verify exact-family static contract
        run: python scripts/check_sec_schedule13_exact_family.py

      - name: Run targeted Schedule 13 reproof
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_SCHEDULE13_REPROOF_APPROVAL: ${{ inputs.approval }}
        run: |
          python scripts/run_sec_schedule13_exact_family_reproof.py \
            --output "$RUNNER_TEMP/sec-schedule13-exact-family-reproof.json" \
            --sentinel "$RUNNER_TEMP/sec-schedule13-exact-family-reproof-sentinel.json"

      - name: Upload safe aggregate evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sec-schedule13-exact-family-reproof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sec-schedule13-exact-family-reproof.json
            ${{ runner.temp }}/sec-schedule13-exact-family-reproof-sentinel.json
          if-no-files-found: warn
